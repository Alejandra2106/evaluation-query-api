spring.application.name=evaluation-query-api
server.port=${EVALUATION_QUERY_API_PORT:8082}

# JWT RS256 emitido por auth-api (HU10). Solo la clave pública X.509, en un archivo externo
# (p. ej. file:/ruta/jwt-publica.pem); nunca se versiona. El emisor debe coincidir con el de auth-api.
# Ambas variables son obligatorias: sin ellas la aplicación no arranca.
evaluationquery.jwt.emisor=${AUTH_JWT_ISSUER}
evaluationquery.jwt.audiencia=evaluation-query-api
evaluationquery.jwt.clave-publica=${EVALUATION_QUERY_JWT_PUBLIC_KEY_LOCATION}

# Lectura de los datos históricos de scoring-api (HU13, HU15), misma base PostgreSQL y esquema public.
# Solo consultas SELECT: esta API no escribe en public ni ejecuta Flyway. EVALUATION_QUERY_DB_URL tiene el
# formato postgresql://host:puerto/base (Spring agrega el prefijo jdbc:). El rol de base de datos debe tener
# únicamente permisos de lectura sobre las tablas consultadas; las conexiones se marcan de solo lectura.
spring.datasource.url=jdbc:${EVALUATION_QUERY_DB_URL:}
spring.datasource.username=${EVALUATION_QUERY_DB_USERNAME:}
spring.datasource.password=${EVALUATION_QUERY_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.read-only=true

# Orígenes del frontend, separados por coma.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
