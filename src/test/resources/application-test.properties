# La clave pública se genera en tiempo de ejecución en cada prueba que arranca el contexto (ClavesRsaPrueba).
evaluationquery.jwt.emisor=auth-api-prueba

# H2 en memoria (una base por contexto) con la réplica mínima del esquema de scoring-api que lee esta API.
# Las pruebas insertan sus datos, por eso aquí las conexiones no se marcan de solo lectura.
spring.datasource.url=jdbc:h2:mem:evaluationquery-${random.uuid};DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.read-only=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:esquema-scoring-h2.sql
